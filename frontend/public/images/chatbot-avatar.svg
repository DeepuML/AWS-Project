<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="50" fill="#ff4d4d"/>
  
  <!-- Robot Head -->
  <rect x="25" y="25" width="50" height="40" rx="5" fill="#ffffff"/>
  
  <!-- Robot Eyes -->
  <circle cx="35" cy="40" r="5" fill="#333333"/>
  <circle cx="65" cy="40" r="5" fill="#333333"/>
  
  <!-- Robot Mouth -->
  <rect x="35" y="55" width="30" height="3" rx="1" fill="#333333"/>
  
  <!-- Robot Antenna -->
  <line x1="50" y1="25" x2="50" y2="15" stroke="#ffffff" stroke-width="3"/>
  <circle cx="50" cy="12" r="3" fill="#ffffff"/>
</svg>