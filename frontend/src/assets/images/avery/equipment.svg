<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <rect width="400" height="400" rx="20" fill="url(#equipment_gradient)" />
  
  <!-- Equipment illustrations -->
  <!-- Dumbbell -->
  <g transform="translate(200, 120)" fill="#FFFFFF" opacity="0.9">
    <rect x="-100" y="-10" width="200" height="20" rx="10" />
    <circle cx="-80" cy="0" r="30" />
    <circle cx="80" cy="0" r="30" />
  </g>
  
  <!-- Bench press -->
  <g transform="translate(200, 220)" fill="#FFFFFF" opacity="0.8">
    <rect x="-120" y="-5" width="240" height="10" rx="5" />
    <circle cx="-110" cy="0" r="20" />
    <circle cx="110" cy="0" r="20" />
    <rect x="-50" y="10" width="100" height="40" rx="5" />
    <rect x="-40" y="50" width="10" height="30" rx="5" />
    <rect x="30" y="50" width="10" height="30" rx="5" />
  </g>
  
  <!-- Kettlebell -->
  <g transform="translate(100, 320)" fill="#FFFFFF" opacity="0.7">
    <circle cx="0" cy="10" r="25" />
    <rect x="-10" y="-30" width="20" height="40" rx="10" />
  </g>
  
  <!-- Medicine ball -->
  <g transform="translate(300, 320)" fill="#FFFFFF" opacity="0.7">
    <circle cx="0" cy="0" r="30" />
    <path d="M-20,-20 L20,20 M-20,20 L20,-20" stroke="#333" stroke-width="2" />
  </g>
  
  <!-- Decorative elements -->
  <circle cx="50" cy="50" r="20" fill="white" opacity="0.1" />
  <circle cx="350" cy="350" r="30" fill="white" opacity="0.1" />
  
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="equipment_gradient" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2ecc71" />
      <stop offset="100%" stop-color="#27ae60" />
    </linearGradient>
  </defs>
</svg>