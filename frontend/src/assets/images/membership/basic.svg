<svg width="300" height="300" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <rect width="300" height="300" rx="20" fill="url(#basic_gradient)" />
  
  <!-- Dumbbell icon -->
  <g transform="translate(100, 100)" fill="#FFFFFF" opacity="0.9">
    <rect x="-60" y="-5" width="120" height="10" rx="5" />
    <circle cx="-50" cy="0" r="20" />
    <circle cx="50" cy="0" r="20" />
  </g>
  
  <!-- Text -->
  <text x="150" y="180" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">BASIC PLAN</text>
  
  <!-- Decorative elements -->
  <circle cx="50" cy="50" r="20" fill="white" opacity="0.1" />
  <circle cx="250" cy="250" r="30" fill="white" opacity="0.1" />
  
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="basic_gradient" x1="0" y1="0" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3498db" />
      <stop offset="100%" stop-color="#2980b9" />
    </linearGradient>
  </defs>
</svg>