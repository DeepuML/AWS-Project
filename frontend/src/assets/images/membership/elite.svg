<svg width="300" height="300" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <rect width="300" height="300" rx="20" fill="url(#elite_gradient)" />
  
  <!-- Diamond icon -->
  <g transform="translate(150, 100)" fill="#FFFFFF" opacity="0.9">
    <path d="M0,-40 L40,0 L0,40 L-40,0 Z" />
    <path d="M0,-20 L20,0 L0,20 L-20,0 Z" fill="url(#elite_gradient)" />
  </g>
  
  <!-- Text -->
  <text x="150" y="180" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">ELITE PLAN</text>
  
  <!-- Decorative elements -->
  <circle cx="50" cy="50" r="20" fill="white" opacity="0.1" />
  <circle cx="250" cy="250" r="30" fill="white" opacity="0.1" />
  <path d="M280,40 L260,60 M260,40 L280,60" stroke="white" stroke-width="4" opacity="0.2" />
  <path d="M40,260 L20,280 M20,260 L40,280" stroke="white" stroke-width="4" opacity="0.2" />
  <circle cx="150" cy="40" r="10" fill="white" opacity="0.2" />
  <circle cx="150" cy="260" r="10" fill="white" opacity="0.2" />
  
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="elite_gradient" x1="0" y1="0" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9b59b6" />
      <stop offset="100%" stop-color="#8e44ad" />
    </linearGradient>
  </defs>
</svg>